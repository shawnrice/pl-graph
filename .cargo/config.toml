# Per-target codegen tuning. rustflags are keyed by target triple: a plain
# `cargo build` (host target) gets `native`; a `--target <triple>` cross build gets
# a pinned, portable CPU baseline.
#
# Cross/deploy targets must not use `native`: it bakes in the build machine's CPU
# features and faults ("illegal instruction") on any host that lacks them. Pin a
# baseline every target host is guaranteed to have.

# Host build on aarch64 macOS. NEON is baseline; `native` also unlocks the host's
# exact feature set (FMA, etc.) for the fastest local builds.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

# x86-64 Linux. x86-64-v3 ≈ Haswell+ (AVX2, BMI2, FMA); drop to x86-64-v2 (SSE4.2,
# no AVX) for pre-2013 hardware.
#
# `-fuse-ld=mold` uses the mold linker: linking the large debug test binaries is a
# big fraction of `cargo test` wall time, and mold cuts it several-fold. mold is
# Linux-only (macOS uses the default ld64); CI installs it (.github/workflows/ci.yml).
# Building x86-64 Linux without mold on PATH? Drop this `link-arg`.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "link-arg=-fuse-ld=mold"]

# arm64 Linux. neoverse-n1 is a broad baseline (AWS Graviton2); use neoverse-v1/-v2
# for Graviton3/4 when the target is fixed.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=neoverse-n1"]
