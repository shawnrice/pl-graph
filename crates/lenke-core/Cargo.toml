[package]
name = "lenke-core"
version = "0.1.0"
edition = "2021"
description = "Columnar labeled-property-graph core: in-memory columnar graph with ISO-GQL and Gremlin engines, serialization codecs, and an Arrow result surface, behind a C ABI (bun:ffi / wasm)."
license = "Apache-2.0"

# Lint policy. The default clippy groups (kept clean), plus a hand-picked set of
# stricter lints. We deliberately avoid `clippy::pedantic` wholesale — its cast
# lints fire constantly on the columnar u32/usize/f64 conversions and bury the
# signal — so these are the low-noise, high-value picks. Enforce in CI with
# `cargo clippy --all-targets -- -D warnings`.
[lints.clippy]
all = { level = "warn", priority = -1 }
# Require a `// SAFETY:` justification on every `unsafe` block (FFI-heavy crate).
undocumented_unsafe_blocks = "warn"
# Readability / modernization (low-noise picks).
uninlined_format_args = "warn"
use_self = "warn"
# Deliberately excluded as net-noise for this type-dispatch-heavy codebase:
#   doc_markdown                       — 50+ capitalized-word false positives
#   missing_const_for_fn (nursery)     — mostly pointless `const` churn
#   redundant_closure_for_method_calls — path-vs-closure is a wash
#   match_same_arms                    — false-positives on Val/GVal dispatch arms
#                                        that share a trivial body but can't merge

# `lib` for unit tests, examples, and the wasm build; `cdylib` for the native
# dynamic library loaded over FFI. Same crate, both bindings.
[lib]
crate-type = ["lib", "cdylib"]

# Dependencies are kept minimal (and optional) so the crate builds fully offline
# and a minimal (e.g. wasm) build can drop everything it doesn't use.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Strip the symbol table (keeps the exported dynsym FFI surface) — the shipped
# cdylib doesn't need it. ~268KB off the .so.
strip = true

[dependencies]
# rayon is optional so the crate builds for wasm32 (browser, no threads):
# `--no-default-features` drops it and decode falls back to a serial parse.
rayon = { version = "1.12.0", optional = true }
# The gremlin `regex()` predicate (pulled in by the `gremlin` feature). Linear-
# time (no catastrophic backtracking); no backreferences/lookaround — a narrow,
# documented divergence from JS `RegExp`/Java `Pattern` (see
# packages/gremlin/GAPS.md). `default-features = false` + a trimmed unicode set
# keeps it lean: `unicode-perl` (\d \w \s \b) and `unicode-case` (case-insensitive
# folding) cover realistic query patterns; the heavier property tables
# (`\p{Script}`, `\p{Age}`, general-category, grapheme `\X`) are dropped (~262KB).
regex = { version = "1", default-features = false, features = [
  "std",
  "unicode-perl",
  "unicode-case",
], optional = true }
# The standalone columnar engine, wired in ONLY for the cross-engine comparison
# harness (the `engine-compare` feature). Off by default so the shipped cdylib/
# wasm carry nothing extra; `packages/native` turns it on to run both engines
# through the same differential-fuzz + bench across every surface. This is a
# regular dep here while `lenke-engine` keeps `lenke-core` as a DEV-dep only, so
# there is no build cycle (dev-deps sit outside the lib dependency graph).
lenke-engine = { path = "../lenke-engine", optional = true }

[features]
# Composable feature set so a minimal build ships only what it uses (the binary
# shrinks with each capability dropped — `serde_json` especially). `default =
# full` is all-inclusive.
default = ["full"]
full = ["gql", "gremlin", "ndjson", "codecs", "arrow", "parallel"]

# Internal marker (leading `_` = not a public knob): enabled by every surface
# whose `lnk_*` FFI fns record a last-error report, so `ffi_error`'s setters gate
# on one `cfg(feature = "_fallible-ffi")` instead of repeating the surface union.
# arrow→gql and codecs→ndjson pull it in transitively.
_fallible-ffi = []


# `gql`: the ISO-GQL engine (hand-rolled parser; carries NO serde_json).
#
# Every other feature depends on it, so it is the base of every configuration —
# `gremlin` and `arrow` already said so and `ndjson`/`parallel` now do too. The
# reason is `graph::constraints`, which is NOT optional: a validator predicate IS
# a GQL predicate, parsed by `gql::parser::parse_predicate` and evaluated by
# `gql::eval::eval_predicate`, so a graph that can enforce a constraint contains
# the engine by construction. `ffi` and the crate root reach into it as well.
# Spelling the dependency is what makes `--no-default-features --features ndjson`
# (and `codecs`, and `parallel`) build at all; they were 26-47 errors each.
gql = ["_fallible-ffi"]
# `gremlin`: the Gremlin traversal engine (heterogeneous JSON results). Its JSON
# carrier is hand-rolled via `jsonfmt`, so it carries NO serde_json.
#
# Depends on `gql`, and that is real rather than incidental: `gremlin::pattern`
# compiles a linear traversal prefix into GQL's pattern IR (`gql::plan::CPath`)
# so Gremlin gets GQL's planner instead of a second one — worth 4-45x, and the
# whole point of sharing an IR. Spelling the dependency here is what makes
# `--no-default-features --features gremlin` build at all.
gremlin = ["gql", "dep:regex", "_fallible-ffi"]
# `ndjson`: the NDJSON load/snapshot codec (hand-rolled JSON, no serde_json).
ndjson = ["gql", "_fallible-ffi"]
# `codecs`: the extra serialization formats (pg-json/pg-text/graphson/csv); the
# combined dispatch also covers ndjson, so it implies it. Hand-rolled JSON — no serde.
codecs = ["ndjson"]
# `arrow`: the Apache Arrow columnar result surface (binary; no serde_json). The
# Arrow output is a query-result format, so it needs the GQL engine.
arrow = ["gql"]

# `parallel`: rayon for bulk ndjson decode (a load-time win, no tradeoff).
parallel = ["gql", "dep:rayon"]
# `parallel-query`: intra-query threading (parallel projection eval). Opt-in and
# off by default — it trades throughput for single-query latency, so it's a
# deliberate choice, not a default.
parallel-query = ["parallel"]

# `engine-compare`: expose the standalone columnar engine behind a parallel
# `lnk_e_*` FFI surface, so the SAME graph/query drives BOTH engines through the
# comparison harness (correctness + perf, native + wasm). Off by default — this
# is a measurement build, not a shipped one.
engine-compare = ["dep:lenke-engine", "gql", "gremlin", "ndjson"]
