[package]
name = "lenke-codec"
version = "0.0.0"
edition = "2021"
description = "Shared graph serialization codecs (pg-json, pg-text, graphson, csv) over a neutral graph model, used by lenke-engine so the format logic lives in ONE place."
license = "Apache-2.0"

# Self-contained: no dependency on lenke-engine. The codecs operate on a neutral
# data model (GraphData + Value); the engine converts its graph to/from that model,
# so the format logic is written once here.
[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
crate-type = ["lib"]

[dependencies]

[dev-dependencies]
