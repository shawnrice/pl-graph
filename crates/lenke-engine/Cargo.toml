[package]
name = "lenke-engine"
version = "0.0.0"
edition = "2021"
description = "The from-scratch query engine: one neutral algebra, one columnar batch model. See docs/design/engine-from-scratch.md."
license = "Apache-2.0"

# Standalone crate on purpose — not yet part of a cargo workspace. Build/test with:
#   cargo test --manifest-path crates/lenke-engine/Cargo.toml
[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
# "lib" so dependents link it as a Rust lib (packages/node's N-API addon, the tests);
# "cdylib" so the engine emits its own liblenke_engine.so / lenke_engine.wasm for the C ABI (src/ffi.rs).
crate-type = ["lib", "cdylib"]

[features]
# `default = codecs`: the shipped build ships the extra textual codecs; a minimal
# build drops them with `--no-default-features` (NDJSON + binary stay — they are
# native, not in the optional crate — so load/query/snapshot still work).
default = ["codecs"]

# `capi`: expose the C ABI (`src/ffi.rs` — the `lnk_*` exports). OFF by default so the
# plain lib/test build does not export the engine's `#[no_mangle]` FFI symbols
# (lnk_abi_version, lnk_alloc, lnk_query, …). Build the standalone backend cdylib/wasm
# WITH this feature:
#   cargo build -p lenke-engine --release --features capi
capi = []

# `codecs`: the extra textual serialization formats (pg-json/pg-text/graphson/csv),
# via the optional shared `lenke-codec` crate. Droppable — csv especially is heavy —
# so a size-sensitive wasm build can cut them. NDJSON/binary are NOT here (native).
codecs = ["dep:lenke-codec"]

[dependencies]

# Foundational types (Value, Batch/Col/Lineage, temporal, error codes) — split into
# a leaf crate so they compile/cache independently of the query layers. A path dep
# (no workspace), like lenke-codec below, so this crate's target/ dir is unchanged.
lenke-engine-core = { path = "../lenke-engine-core" }

# The shared serialization codecs (pg-json/pg-text/graphson/csv) over a neutral
# graph model — so the native and wasm builds emit byte-identical format output from
# identical data. Zero-dep and wasm-clean; the engine supplies
# only the Store<->GraphData bridge (see `src/codec.rs`). Optional so a minimal
# build can drop the whole dependency — see the `codecs` feature.
lenke-codec = { path = "../lenke-codec", optional = true }

# The Gremlin `regex()` / `TextP.regex()` predicate. The ONE runtime dependency:
# byte-identity across the native/wasm/TS targets requires the SAME regex engine and
# feature set (linear-time, no backreferences/lookaround; a trimmed unicode set —
# `unicode-perl` + `unicode-case`). Everything
# else in this crate stays std-only.
regex = { version = "1", default-features = false, features = [
  "std",
  "unicode-perl",
  "unicode-case",
] }

[dev-dependencies]
# Test-only: the ported Gremlin suite (tests/gremlin_ported.rs) and the GQL
# conformance corpus (tests/gql_corpus.rs) read fixtures/JSONL as serde_json.
# A dev-dependency compiles only for the test build, so the runtime crate stays
# dependency-free. (The former `lenke-core` dev-dep — the cross-engine oracle — is
# gone: those suites now run engine-only, with the TS engine as the byte-identity
# reference; see docs/design/engine-from-scratch.md.)
serde_json = "1"

# Compile-speed tuning for the dev/test loop. `debug = 1` emits line-tables only
# (file/line for backtraces + panics) instead of full DWARF — the test binaries
# here are large, and full debuginfo dominates both codegen and link time, so this
# is a sizeable `cargo test` speedup with no effect on correctness or on the
# `--release` artifacts (the .so/.wasm) which keep their own profile. Move these to
# the workspace root if/when this crate joins one.
[profile.dev]
debug = 1

# Tests run OPTIMIZED (opt-level 1). The heavy suites — the GQL corpus, the varlen/
# algo tests — are compute-bound, and unoptimized they dominate `cargo test` wall
# time (the corpus alone ran ~74s at opt-level 0, ~7s optimized). opt-level 1 is a
# fraction of the compile cost of a full release build yet recovers most of that
# runtime, and mold + `debug = 1` keep the (re)compile fast. `cargo build`/`check`
# stay at opt-level 0 (profile.dev) so the plain build loop is untouched.
[profile.test]
opt-level = 1
debug = 1
