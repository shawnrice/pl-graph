[package]
name = "lenke-engine"
version = "0.0.0"
edition = "2021"
description = "The from-scratch query engine: one neutral algebra, one columnar batch model. See docs/design/engine-from-scratch.md."
license = "Apache-2.0"

# Not part of a cargo workspace. Build and test directly:
#   cargo test --manifest-path crates/lenke-engine/Cargo.toml
[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
# "lib" so dependents link it as a Rust lib (packages/node's N-API addon, the tests);
# "cdylib" so the engine emits its own liblenke_engine.so / lenke_engine.wasm for the C ABI (src/ffi.rs).
crate-type = ["lib", "cdylib"]

[features]
# `default = codecs`: the shipped build ships the extra textual codecs; a minimal
# build drops them with `--no-default-features` (NDJSON + binary stay — they are
# native, not in the optional crate — so load/query/snapshot still work).
default = ["codecs"]

# `capi`: expose the C ABI (`src/ffi.rs` — the `lnk_*` exports). OFF by default so the
# plain lib/test build does not export the engine's `#[no_mangle]` FFI symbols
# (lnk_abi_version, lnk_alloc, lnk_query, …). Build the standalone backend cdylib/wasm
# WITH this feature:
#   cargo build -p lenke-engine --release --features capi
capi = []

# `codecs`: the extra textual serialization formats (pg-json/pg-text/graphson/csv),
# via the optional shared `lenke-codec` crate. Droppable — csv especially is heavy —
# so a size-sensitive wasm build can cut them. NDJSON/binary are NOT here (native).
codecs = ["dep:lenke-codec"]

[dependencies]

# Foundational types (Value, Batch/Col/Lineage, temporal, error codes) in a leaf
# crate, so they compile and cache independently of the query layers. Path dependency.
lenke-engine-core = { path = "../lenke-engine-core" }

# The shared serialization codecs (pg-json/pg-text/graphson/csv) over a neutral
# graph model. Zero-dep and wasm-clean; the engine supplies only the
# Store<->GraphData bridge (`src/codec.rs`). Optional — gated on the `codecs` feature.
lenke-codec = { path = "../lenke-codec", optional = true }

# The Gremlin `regex()` / `TextP.regex()` predicate — the crate's only runtime
# dependency. Byte-identity across the native/wasm/TS targets needs the same regex
# engine and feature set: linear-time, no backreferences/lookaround, a trimmed
# unicode set (`unicode-perl` + `unicode-case`). Everything else stays std-only.
regex = { version = "1", default-features = false, features = [
  "std",
  "unicode-perl",
  "unicode-case",
] }

[dev-dependencies]
# Test-only: the ported Gremlin suite (tests/gremlin_ported.rs) and the GQL
# conformance corpus (tests/gql_corpus.rs) read fixtures/JSONL as serde_json. A
# dev-dependency, so the runtime crate stays dependency-free.
serde_json = "1"

# `debug = 1` emits line-tables only (file/line for backtraces and panics) instead
# of full DWARF, cutting codegen and link time for the large test binaries. The
# `--release` artifacts (.so/.wasm) keep their own profile.
[profile.dev]
debug = 1

# Tests run at opt-level 1: the compute-bound suites (GQL corpus, varlen/algo)
# dominate `cargo test` wall time when unoptimized, and opt-level 1 recovers most of
# that at a fraction of a release build's compile cost. `cargo build` and `check`
# stay at opt-level 0 (profile.dev).
[profile.test]
opt-level = 1
debug = 1
