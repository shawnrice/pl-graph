[package]
name = "lenke-engine"
version = "0.0.0"
edition = "2021"
description = "The from-scratch query engine: one neutral algebra, one columnar batch model. Independent of lenke-core; see docs/design/engine-from-scratch.md."
license = "Apache-2.0"

# Standalone crate on purpose — NOT part of any workspace with lenke-core, so the
# existing engine's build/tooling is untouched. Build/test with:
#   cargo test --manifest-path crates/lenke-engine/Cargo.toml
[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
crate-type = ["lib"]

[dependencies]

# lenke-core is a dev-only dependency: the J1 cross-engine conformance suite
# (tests/conformance.rs) loads an identical fixture into BOTH engines and asserts
# equal result multisets. A dev-dependency compiles only for the test build, so
# the normal `cargo build` of lenke-engine stays standalone and dependency-free.
# This does not touch lenke-core's own sources or build.
[dev-dependencies]
lenke-core = { path = "../lenke-core" }
