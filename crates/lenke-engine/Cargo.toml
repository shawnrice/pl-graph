[package]
name = "lenke-engine"
version = "0.0.0"
edition = "2021"
description = "The from-scratch query engine: one neutral algebra, one columnar batch model. Independent of lenke-core; see docs/design/engine-from-scratch.md."
license = "Apache-2.0"

# Standalone crate on purpose — NOT part of any workspace with lenke-core, so the
# existing engine's build/tooling is untouched. Build/test with:
#   cargo test --manifest-path crates/lenke-engine/Cargo.toml
[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
# "lib" for the engine-compare harness (core dev-depends on it); "cdylib" so the
# engine emits its own liblenke_engine.so / lenke_engine.wasm for the C ABI (src/ffi.rs).
crate-type = ["lib", "cdylib"]

[features]
# `capi`: expose the C ABI (`src/ffi.rs` — the `lnk_*` exports). OFF by default so
# that when lenke-core links this crate as a lib for its `engine-compare` harness,
# the engine's `#[no_mangle]` symbols (lnk_abi_version, lnk_alloc, lnk_last_error_json,
# …) do NOT collide with core's identically-named exports. Build the standalone
# backend cdylib/wasm WITH this feature:
#   cargo build -p lenke-engine --release --features capi
capi = []

[dependencies]

# The Gremlin `regex()` / `TextP.regex()` predicate. The ONE runtime dependency:
# byte-identity with core's regex predicate requires the SAME engine, so the crate
# and its feature set mirror lenke-core exactly (linear-time, no backreferences/
# lookaround; a trimmed unicode set — `unicode-perl` + `unicode-case`). Everything
# else in this crate stays std-only.
regex = { version = "1", default-features = false, features = [
  "std",
  "unicode-perl",
  "unicode-case",
] }

# lenke-core is a dev-only dependency: the J1 cross-engine conformance suite
# (tests/conformance.rs) loads an identical fixture into BOTH engines and asserts
# equal result multisets. A dev-dependency compiles only for the test build, so
# the normal `cargo build` of lenke-engine stays standalone and dependency-free.
# This does not touch lenke-core's own sources or build.
[dev-dependencies]
lenke-core = { path = "../lenke-core" }
# Test-only: the shared GQL conformance corpus (tests/gql_corpus.rs) reads JSONL
# cases. serde_json is a dev-dependency, so the runtime crate stays dependency-free.
serde_json = "1"
